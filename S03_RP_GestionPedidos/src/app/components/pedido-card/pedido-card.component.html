<div class="pedido-card">
  <!-- Status Indicator Top Bar -->
  <div class="card-status-bar" [ngClass]="pedido.estado.toLowerCase()"></div>

  <!-- Header -->
  <div class="card-header">
    <div class="id-wrapper">
      <span class="id-icon">#</span>
      <span class="pedido-id">{{ pedido.id }}</span>
    </div>
    <div class="status-badge" [ngClass]="pedido.estado.toLowerCase()">
      <span class="status-dot"></span>
      {{ pedido.estado }}
    </div>
  </div>

  <!-- Body -->
  <div class="card-body">
    <h3 class="card-title">{{ pedido.producto }}</h3>
    
    <div class="card-customer">
      <svg class="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>{{ pedido.cliente }}</span>
    </div>

    <!-- Data Grid -->
    <div class="info-grid">
      <div class="info-item">
        <span class="info-label">Cantidad</span>
        <div class="info-value-wrapper">
          <span class="info-value">{{ pedido.cantidad }}</span>
          <span class="unit">unid.</span>
        </div>
      </div>
      
      <div class="info-item price-item">
        <span class="info-label">Total</span>
        <span class="info-value price">{{ pedido.precioTotal | currency:'EUR':'symbol':'1.2-2' }}</span>
      </div>
    </div>
  </div>

  <!-- Footer Actions -->
  <div class="card-footer">
    <button class="btn-action btn-edit" (click)="onEditar()" title="Editar pedido">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
      <span>Editar</span>
    </button>
    
    <button class="btn-action btn-delete" (click)="onEliminar()" title="Eliminar pedido">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
      <span>Eliminar</span>
    </button>
  </div>
</div>
