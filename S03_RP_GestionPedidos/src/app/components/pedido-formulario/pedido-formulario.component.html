<div class="card-form">
  <h2>{{ pedidoAEditar ? 'Editar Pedido' : 'Nuevo Pedido' }}</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="cliente">Cliente:</label>
      <input type="text" id="cliente" [(ngModel)]="cliente" name="cliente" required placeholder="Nombre del cliente" />
    </div>

    <div class="form-group">
      <label for="producto">Producto:</label>
      <input type="text" id="producto" [(ngModel)]="producto" name="producto" required placeholder="Descripción del producto" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" [(ngModel)]="cantidad" name="cantidad" min="1" required />
      </div>

      <div class="form-group">
        <label for="precio">Precio Total ($):</label>
        <input type="number" id="precio" [(ngModel)]="precioTotal" name="precioTotal" min="0" step="0.01" required />
      </div>
    </div>

    <div class="form-group">
      <label for="estado">Estado:</label>
      <select id="estado" [(ngModel)]="estado" name="estado">
        <option value="Pendiente">Pendiente</option>
        <option value="Procesando">Procesando</option>
        <option value="Completado">Completado</option>
        <option value="Cancelado">Cancelado</option>
      </select>
    </div>

    <div class="actions">
      <button type="submit" class="btn btn-primary">
        {{ pedidoAEditar ? 'Actualizar' : 'Guardar' }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="onCancelar()" *ngIf="pedidoAEditar">
        Cancelar
      </button>
    </div>
  </form>
</div>
