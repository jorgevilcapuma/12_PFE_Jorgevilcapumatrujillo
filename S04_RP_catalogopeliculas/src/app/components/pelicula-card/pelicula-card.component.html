<div class="card h-100 shadow-sm pelicula-card" 
     [class.destacada]="pelicula.calificacion >= 8" 
     [class.regular]="pelicula.calificacion < 8">
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <h5 class="card-title fw-bold m-0 text-primary">{{ pelicula.titulo }}</h5>
      <span class="badge bg-dark rounded-pill">{{ pelicula.anio }}</span>
    </div>
    
    <p class="card-text text-muted mb-3">
      <strong>Género:</strong> {{ pelicula.genero }}
    </p>
    
    <div class="mt-auto">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="text-secondary fw-semibold">Calificación:</span>
        <span class="fs-5 fw-bold" [class.text-success]="pelicula.calificacion >= 8" [class.text-warning]="pelicula.calificacion < 8">
          {{ pelicula.calificacion }} / 10 ⭐
        </span>
      </div>

      <!-- Regla de Evaluación Condicional Obligatoria con @if -->
      <div class="text-center pt-2 border-top">
        @if (pelicula.calificacion >= 8) {
          <span class="badge bg-success-subtle text-success border border-success px-3 py-2 w-100 fs-6">
            ⭐ Muy recomendada
          </span>
        } @else {
          <span class="badge bg-secondary-subtle text-secondary border border-secondary px-3 py-2 w-100 fs-6">
            🎬 Puedes verla
          </span>
        }
      </div>
    </div>
  </div>
</div>
