<div class="mb-4">
  <h4 class="fw-bold mb-3 text-secondary">🎥 Catálogo Registrado ({{ listaPeliculas.length }})</h4>
  
  <div class="row g-3">
    <!-- Directiva móderna @for -->
    @for (pelicula of listaPeliculas; track pelicula.titulo) {
      <div class="col-12 col-md-6 col-lg-4">
        <app-pelicula-card [pelicula]="pelicula"></app-pelicula-card>
      </div>
    } @empty {
      <div class="col-12 text-center py-5 bg-white rounded border empty-container">
        <p class="fs-4 text-muted m-0">🎞️ No hay películas registradas en el catálogo.</p>
        <small class="text-secondary">Utiliza el formulario para registrar la primera película.</small>
      </div>
    }
  </div>
</div>
